<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="Jash Bohare, Full-Stack Blockchain Developer">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-out infinite; transform-origin: 30px 186px; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
    @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none; } .pulse { opacity: 0; } }
  </style>
  <text x="24" y="40" class="mono" font-size="13" letter-spacing="2" fill="#6B6D66">FULL-STACK BLOCKCHAIN DEVELOPER</text>
  <text x="22" y="104" class="sans" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#1E1F1B">Jash Bohare</text>
  <text x="24" y="140" class="mono" font-size="17" fill="#1E1F1B">contracts <tspan fill="#4E7A12">→</tspan> indexers <tspan fill="#4E7A12">→</tspan> interfaces<tspan class="cursor" fill="#4E7A12"> ▍</tspan></text>
  <line x1="24" y1="164" x2="816" y2="164" stroke="#D9D8D1" stroke-width="1"/>
  <circle class="pulse" cx="30" cy="186" r="4" fill="#4E7A12"/>
  <circle cx="30" cy="186" r="4" fill="#4E7A12"/>
  <text x="44" y="191" class="mono" font-size="13" fill="#6B6D66">open to part-time · contract · freelance</text>
  <text x="816" y="191" class="mono" font-size="13" fill="#6B6D66" text-anchor="end">IST · UTC+5:30</text>
</svg>

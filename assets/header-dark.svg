<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="Jash Bohare, Full-Stack Blockchain Developer. Contracts, indexers, interfaces. Open to part-time, contract and freelance work.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .w { animation: rise .5s ease-out backwards; }
    .w0 { animation-delay: 0.35s; }
    .w1 { animation-delay: 0.70s; }
    .w2 { animation-delay: 1.05s; }
    .w3 { animation-delay: 1.40s; }
    .w4 { animation-delay: 1.75s; }
    .dot { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0% { opacity: .5; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
    @media (prefers-reduced-motion: reduce) { .w, .dot { animation: none; } .dot { opacity: 0; } }
  </style>
  <text x="24" y="40" class="mono" font-size="13" letter-spacing="2" fill="#8B8D86">FULL-STACK BLOCKCHAIN DEVELOPER</text>
  <text x="22" y="104" class="sans" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#F2F1EC">Jash Bohare</text>
  <text x="24" y="140" class="mono" font-size="17"><tspan class="w w0" fill="#F2F1EC">contracts</tspan><tspan class="w w1" fill="#C6F03C"> → </tspan><tspan class="w w2" fill="#F2F1EC">indexers</tspan><tspan class="w w3" fill="#C6F03C"> → </tspan><tspan class="w w4" fill="#F2F1EC">interfaces</tspan></text>
  <line x1="24" y1="164" x2="816" y2="164" stroke="#30332D" stroke-width="1"/>
  <circle class="dot" cx="30" cy="186" r="4" fill="#C6F03C"/>
  <circle cx="30" cy="186" r="4" fill="#C6F03C"/>
  <text x="44" y="191" class="mono" font-size="13" fill="#8B8D86">open to part-time · contract · freelance</text>
  <text x="816" y="191" class="mono" font-size="13" fill="#8B8D86" text-anchor="end">IST · UTC+5:30</text>
</svg>
